<svg viewBox="0 0 1240 520" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="1240" height="520" fill="#ffffff"/>

  <text x="20" y="22" font-size="14" fill="#495057" font-weight="600">LIVE SESSION — single agent, real time</text>
  <rect x="20" y="35" width="120" height="50" rx="8" fill="#d0ebff" stroke="#1e1e1e"/>
  <text x="80" y="64" font-size="11" text-anchor="middle">Learner (speaks)</text>
  <rect x="170" y="35" width="90" height="50" rx="8" fill="#e9ecef" stroke="#1e1e1e"/>
  <text x="215" y="64" font-size="11" text-anchor="middle">STT</text>
  <rect x="290" y="25" width="180" height="70" rx="8" fill="#ffd8a8" stroke="#1e1e1e"/>
  <text x="380" y="55" font-size="12" text-anchor="middle" font-weight="600">LIVE TUTOR</text>
  <text x="380" y="70" font-size="12" text-anchor="middle" font-weight="600">AGENT</text>
  <rect x="500" y="35" width="90" height="50" rx="8" fill="#e9ecef" stroke="#1e1e1e"/>
  <text x="545" y="64" font-size="11" text-anchor="middle">TTS</text>
  <rect x="620" y="35" width="130" height="50" rx="8" fill="#d0ebff" stroke="#1e1e1e"/>
  <text x="685" y="64" font-size="11" text-anchor="middle">Learner (hears)</text>
  <rect x="800" y="35" width="180" height="50" rx="8" fill="#fff3bf" stroke="#1e1e1e"/>
  <text x="890" y="55" font-size="10" text-anchor="middle">learner-state.json</text>
  <text x="890" y="68" font-size="10" text-anchor="middle">(current focus)</text>

  <path d="M140,60 H170" stroke="#1e1e1e" fill="none" marker-end="url(#a)"/>
  <path d="M260,60 H290" stroke="#1e1e1e" fill="none" marker-end="url(#a)"/>
  <path d="M470,60 H500" stroke="#1e1e1e" fill="none" marker-end="url(#a)"/>
  <path d="M590,60 H620" stroke="#1e1e1e" fill="none" marker-end="url(#a)"/>
  <path d="M800,60 H470 Q 480,60 480,95" stroke="#1e1e1e" fill="none" stroke-dasharray="4 3" marker-end="url(#a)"/>

  <text x="20" y="125" font-size="13" fill="#868686">— session ends —</text>

  <text x="20" y="150" font-size="14" fill="#495057" font-weight="600">POST-SESSION — orchestrator → parallel workers → sequential planner</text>

  <rect x="290" y="165" width="200" height="45" rx="8" fill="#d0ebff" stroke="#1e1e1e"/>
  <text x="390" y="192" font-size="11" text-anchor="middle">Session Transcript</text>

  <rect x="260" y="230" width="260" height="60" rx="8" fill="#ffd8a8" stroke="#1e1e1e"/>
  <text x="390" y="255" font-size="12" text-anchor="middle" font-weight="600">SESSION WRAP-UP</text>
  <text x="390" y="270" font-size="12" text-anchor="middle" font-weight="600">ORCHESTRATOR</text>

  <rect x="60" y="330" width="230" height="70" rx="8" fill="#b2f2bb" stroke="#1e1e1e"/>
  <text x="175" y="358" font-size="11" text-anchor="middle" font-weight="600">ERROR PATTERN</text>
  <text x="175" y="372" font-size="11" text-anchor="middle" font-weight="600">ANALYST</text>
  <text x="175" y="388" font-size="9" text-anchor="middle">(Module 3 subagent)</text>

  <rect x="340" y="330" width="230" height="70" rx="8" fill="#b2f2bb" stroke="#1e1e1e"/>
  <text x="455" y="358" font-size="11" text-anchor="middle" font-weight="600">VOCABULARY</text>
  <text x="455" y="372" font-size="11" text-anchor="middle" font-weight="600">TRACKER</text>
  <text x="455" y="388" font-size="9" text-anchor="middle">(new subagent)</text>

  <rect x="610" y="330" width="230" height="70" rx="8" fill="none" stroke="#e03131" stroke-dasharray="4 3"/>
  <text x="725" y="352" font-size="9" text-anchor="middle" fill="#e03131">If a worker fails: orchestrator</text>
  <text x="725" y="364" font-size="9" text-anchor="middle" fill="#e03131">keeps its prior file unchanged</text>
  <text x="725" y="376" font-size="9" text-anchor="middle" fill="#e03131">and logs the failure, continues</text>
  <text x="725" y="388" font-size="9" text-anchor="middle" fill="#e03131">with the other worker's result</text>

  <rect x="60" y="430" width="230" height="35" rx="6" fill="#fff3bf" stroke="#1e1e1e"/>
  <text x="175" y="452" font-size="10" text-anchor="middle">patterns.json (updated)</text>

  <rect x="340" y="430" width="230" height="35" rx="6" fill="#fff3bf" stroke="#1e1e1e"/>
  <text x="455" y="452" font-size="10" text-anchor="middle">vocab.json (updated)</text>

  <rect x="200" y="485" width="260" height="30" rx="6" fill="#b2f2bb" stroke="#1e1e1e"/>
  <text x="330" y="504" font-size="10" text-anchor="middle" font-weight="600">SESSION PLANNER (next_focus)</text>

  <path d="M390,210 V230" stroke="#1e1e1e" fill="none" marker-end="url(#a)"/>
  <path d="M340,290 L220,330" stroke="#1e1e1e" fill="none" marker-end="url(#a)"/>
  <path d="M440,290 L470,330" stroke="#1e1e1e" fill="none" marker-end="url(#a)"/>
  <path d="M490,260 H610" stroke="#1e1e1e" fill="none" stroke-dasharray="4 3"/>
  <path d="M175,400 V430" stroke="#1e1e1e" fill="none" marker-end="url(#a)"/>
  <path d="M455,400 V430" stroke="#1e1e1e" fill="none" marker-end="url(#a)"/>
  <path d="M175,465 L280,485" stroke="#1e1e1e" fill="none" marker-end="url(#a)"/>
  <path d="M455,465 L380,485" stroke="#1e1e1e" fill="none" marker-end="url(#a)"/>
  <path d="M460,500 Q 900,500 890,95" stroke="#1e1e1e" fill="none" marker-end="url(#a)"/>
  <text x="700" y="515" font-size="10" fill="#495057">feeds next session's focus (loop back to top)</text>

  <rect x="980" y="25" width="230" height="70" rx="8" fill="#eebefa" stroke="#1e1e1e"/>
  <text x="1095" y="48" font-size="10" text-anchor="middle" font-weight="600">DESIGN SYSTEM SKILL</text>
  <text x="1095" y="62" font-size="9" text-anchor="middle">(Module 2, build-time only —</text>
  <text x="1095" y="74" font-size="9" text-anchor="middle">not part of the runtime loop)</text>

  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1e1e1e"/>
    </marker>
  </defs>
</svg>
